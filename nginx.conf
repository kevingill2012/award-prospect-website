server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # 目录补斜杠的 301 用相对地址（Location: /privacy/）。nginx 在 Cloudflare 后面
    # 只看到 http，绝对地址会跳到 http://，而域名没开"始终使用 HTTPS"
    absolute_redirect off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Cache static assets aggressively
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /images {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Legal pages: no-cache
    location /privacy {
        try_files $uri $uri/ /privacy/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /terms {
        try_files $uri $uri/ /terms/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /cookies {
        try_files $uri $uri/ /cookies/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 不存在的路径返回真正的 404（显示站内 404 页），不再兜底回首页：
    # 安全门禁第 5 节要求 /.git/config、/.env 这类敏感路径必须是 404
    error_page 404 /_not-found/index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
